<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nanosoft OS - Floating Clean</title>
    <style>
        :root {
            --bg: #000000;
            --accent: #007AFF; 
        }

        body {
            background: var(--bg);
            background-image: 
                radial-gradient(circle at 10% 10%, rgba(0, 122, 255, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 90%, rgba(0, 122, 255, 0.05) 0%, transparent 40%);
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* --- TIMER --- */
        .timer-container {
            text-align: center;
            z-index: 10;
        }

        h1 { 
            font-size: 0.8rem; 
            font-weight: 500; 
            color: rgba(255,255,255,0.2); 
            margin-bottom: 0; 
            letter-spacing: 3px; 
            text-transform: uppercase;
        }

        #main-timer { 
            font-size: clamp(4rem, 20vw, 8rem); 
            font-weight: 800; 
            letter-spacing: -5px; 
            font-variant-numeric: tabular-nums;
            background: linear-gradient(180deg, #FFFFFF 0%, rgba(255,255,255,0.3) 100%);
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent;
            line-height: 1;
        }

        /* --- FLYTANDE TEXT (UTANFÖR MITTEN) --- */
        .floating-text {
            position: fixed;
            color: var(--accent);
            font-size: 0.9rem;
            font-weight: 400;
            letter-spacing: 1px;
            pointer-events: none;
            white-space: nowrap;
            animation: popFade 2.5s ease-out forwards;
            z-index: 5;
        }

        @keyframes popFade {
            0% { opacity: 0; transform: translateY(10px); }
            15% { opacity: 1; transform: translateY(0); }
            85% { opacity: 1; }
            100% { opacity: 0; transform: translateY(-15px); }
        }

        /* --- POWERED BY TEXT --- */
        .powered-by {
            margin-top: 15px;
            font-size: 11px;
            color: rgba(255,255,255,0.3);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .footer { 
            position: fixed; 
            bottom: 30px; 
            font-size: 10px; 
            color: rgba(255,255,255,0.1); 
            letter-spacing: 3px; 
            text-transform: uppercase; 
        }
    </style>
</head>
<body>

    <div class="timer-container">
        <h1>Uptime</h1>
        <div id="main-timer">00:00</div>
        <div class="powered-by">Powered by Nanosoft</div>
    </div>

    <div class="footer">Nanosoft Minimal v4.1</div>

    <script>
        let seconds = 0;

        function spawnText(msg) {
            const textNode = document.createElement('div');
            textNode.className = 'floating-text';
            textNode.innerText = msg;

            // Logik för att undvika mitten (timern)
            // Vi slumpar positioner men tvingar dem till kanterna (vänster 0-30% eller höger 70-90%)
            const side = Math.random() > 0.5 ? 'left' : 'right';
            let x;
            if (side === 'left') {
                x = Math.random() * 25 + 5; // 5% till 30%
            } else {
                x = Math.random() * 25 + 70; // 70% till 95%
            }

            const y = Math.random() * 80 + 10; // 10% till 90% på höjden

            textNode.style.left = x + '%';
            textNode.style.top = y + '%';

            document.body.appendChild(textNode);

            setTimeout(() => {
                textNode.remove();
            }, 2500);
        }

        setInterval(() => {
            seconds++;
            
            let m = Math.floor(seconds / 60).toString().padStart(2, '0');
            let s = (seconds % 60).toString().padStart(2, '0');
            document.getElementById('main-timer').innerText = `${m}:${s}`;

            // Meddelanden vid specifika tider
            if (seconds === 10) spawnText("10 seconds logged.");
            if (seconds === 30) spawnText("Half a minute reached.");
            if (seconds === 60) spawnText("60 seconds. Efficiency optimal.");
            if (seconds === 120) spawnText("2 minutes active.");
            
            // Slumpmässiga system-meddelanden efter 2 minuter
            if (seconds > 120 && seconds % 40 === 0) {
                const randomMsgs = ["All systems nominal.", "Time is flowing.", "Nanosoft monitoring...", "Data synchronizing."];
                spawnText(randomMsgs[Math.floor(Math.random() * randomMsgs.length)]);
            }

        }, 1000);
    </script>
</body>
</html>
